name: Streamplan aktualisieren

on:
  schedule:
    - cron: "7 * * * *"   # jede Stunde (UTC)
  workflow_dispatch:       # zusätzlich per Knopf startbar

permissions:
  contents: write

concurrency:
  group: stream-plan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Streamplan aus dem Google Kalender erzeugen
        run: python scripts/update_stream_plan.py

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- data/stream-plan.json; then
            echo "Keine Änderung am Streamplan."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stream-plan.json
            git commit -m "Streamplan automatisch aktualisiert"
            git pull --rebase
            git push
          fi
